name: Deploy React (Vite) App to FTP

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ftp-deploy
  cancel-in-progress: true

env:
  FTP_USER: ${{ vars.FTP_USER }}
  FTP_HOST: ${{ vars.FTP_HOST }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Display Node & NPM Version
        run: |
          node -v
          npm -v

      - name: Install Dependencies
        run: npm install

      - name: Build Project
        run: npm run build

      - name: Verify Build Output
        run: ls -la dist

      - name: Deploy to FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ env.FTP_HOST }}
          username: ${{ env.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          server-dir: /
          local-dir: ./dist/
          exclude: |
            **/.git*
            **/.github/**
            **/node_modules/**
            **/src/**
            **/public/**