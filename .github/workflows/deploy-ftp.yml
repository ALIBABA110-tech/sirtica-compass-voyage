name: Deploy TanStack Start App to FTP

on:
  push:
    branches:
      - deploy
  workflow_dispatch:

concurrency:
  group: ftp-deploy
  cancel-in-progress: true

env:
  FTP_USER: ${{ vars.FTP_USER }}
  FTP_HOST: ${{ vars.FTP_HOST }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm install

      - name: Build Application
        run: npm run build

      - name: Deploy Project
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ env.FTP_HOST }}
          username: ${{ env.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}

          # Change this to your Node.js app directory
          server-dir: /

          # Upload the entire project
          local-dir: ./

          exclude: |
            **/.git*
            **/.github/**
            **/.vscode/**
            **/node_modules/**
            **/.idea/**
            **/.DS_Store
            **/*.log
            .env