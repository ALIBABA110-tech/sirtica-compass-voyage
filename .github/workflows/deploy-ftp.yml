name: Deploy Vite React App to FTP

on:
  push:
    branches:
      - deploy
  workflow_dispatch:

concurrency:
  group: ftp-deploy
  cancel-in-progress: true

env:
  FTP_USER: ${{ vars.FTP_USER }}
  FTP_HOST: ${{ vars.FTP_HOST }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify build
        run: ls -la dist

      - name: FTP Deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ env.FTP_HOST }}
          username: ${{ env.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          server-dir: public_html/
          local-dir: dist/